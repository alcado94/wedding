<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra boda</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: #f8f3ef;
      color: #493b36;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    main {
      max-width: 38rem;
      padding: 3rem 2rem;
      background: #fff;
      border: 1px solid #eadfd8;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgb(73 59 54 / 8%);
    }

    h1 {
      margin: 0 0 1rem;
      color: #8a5d50;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: normal;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Nos casamos!</h1>
    <p>Estamos muy felices de compartir este día tan especial contigo.</p>
    <p>Próximamente encontrarás aquí todos los detalles de nuestra boda.</p>
  </main>
</body>
</html>
